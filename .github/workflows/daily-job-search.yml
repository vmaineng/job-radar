name: Daily Job Search

on:
  schedule:
    # 7:00 AM Pacific = 14:00 UTC (13:00 during PDT — adjust if needed for daylight saving)
    - cron: "0 14 * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the GitHub Actions tab too

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job search pipeline
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          ADZUNA_COUNTRY: us
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SEARCH_TITLES: "Junior Software Engineer,Software Engineer I,Associate Software Engineer,Software Engineer New Grad,Entry Level Software Engineer"
          SEARCH_LOCATION: "Los Angeles"
          INCLUDE_REMOTE: "true"
        run: python run_pipeline.py
